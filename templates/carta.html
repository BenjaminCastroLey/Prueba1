<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>La Caleta - Carta</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      body {
        margin: 0;
        background: #dfe0d8;
        color: #1c2c3f;
        font-family: Arial, Helvetica, sans-serif;
      }

      .topbar {
        background: #153b52;
        color: white;
        height: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 2rem;
        font-weight: 700;
      }

      .brand-mark {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #f4d36b;
        position: relative;
      }

      .brand-mark::before {
        content: "";
        position: absolute;
        inset: 8px 8px 8px 8px;
        border-radius: 50%;
        background: #153b52;
      }

      .cart-btn {
        background: transparent;
        border: none;
        color: white;
        font-size: 1.1rem;
        font-weight: 700;
        padding: 10px 18px;
      }

      .page-wrap {
        max-width: 1180px;
        margin: 0 auto;
        padding: 28px 18px 0;
      }

      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: #1d2d3e;
        font-size: 1.1rem;
        margin: 0 0 20px;
        font-weight: 500;
      }

      .back-link::before {
        content: "←";
        font-size: 1.5rem;
        line-height: 1;
      }

      .detail-card {
        background: rgba(255, 255, 255, 0.35);
        border: 1px solid #d9d8d3;
        border-radius: 14px;
        padding: 22px 28px 20px;
        min-height: 430px;
      }

      .type {
        font-size: 0.9rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #324a62;
        margin-bottom: 18px;
      }

      .dish-name {
        font-size: 3rem;
        font-weight: 800;
        margin: 0 0 24px;
        line-height: 1.1;
      }

      .info-link {
        display: inline-block;
        color: #2d6f9a;
        font-size: 1.2rem;
        text-decoration: underline;
        margin-bottom: 24px;
      }

      .specs {
        display: grid;
        grid-template-columns: 180px 1fr;
        row-gap: 15px;
        column-gap: 20px;
        max-width: 560px;
        font-size: 1.15rem;
        margin-bottom: 28px;
      }

      .specs .label {
        color: #253b4d;
        font-weight: 400;
      }

      .specs .value {
        color: #1c2b3a;
        font-weight: 600;
        text-align: left;
      }

      .section-title {
        font-size: 2.1rem;
        font-weight: 800;
        margin: 0 0 18px;
      }

      .description {
        font-size: 1.18rem;
        line-height: 1.5;
        margin: 0;
        color: #23374a;
      }

      .footer {
        text-align: center;
        padding: 26px 0 22px;
        color: #3b4b59;
        font-size: 0.9rem;
        margin-top: 14px;
      }

      @media (max-width: 640px) {
        .brand {
          font-size: 1.5rem;
        }

        .dish-name {
          font-size: 2.4rem;
        }

        .specs {
          grid-template-columns: 1fr;
          row-gap: 8px;
        }

        .detail-card {
          padding: 20px 18px 18px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span>La Caleta</span>
      </div>
      <button class="cart-btn" type="button" data-ui-text="cart">Carta</button>
    </header>

    <main class="page-wrap">
      <a href="#" class="back-link" data-ui-text="backToMenu">Volver a la carta</a>

      <section class="detail-card">
        <div class="type">Entrada</div>
        <h1 class="dish-name">Ceviche de reineta</h1>

        <a href="#" class="info-link" data-ui-text="containsSpice">Contiene aji</a>

        <div class="specs">
          <div class="label">Precio</div>
          <div class="value">$8900</div>

          <div class="label">Con propina (10%)</div>
          <div class="value">$9790</div>

          <div class="label">Tiempo de preparacion</div>
          <div class="value">10 minutos</div>

          <div class="label">Vegetariano</div>
          <div class="value">No</div>

          <div class="label">Picante</div>
          <div class="value">Si</div>
        </div>

        <h2 class="section-title">Descripcion</h2>
        <p class="description">
          Reineta fresca marinada en limon con cebolla morada, cilantro y aji verde.
        </p>
      </section>
    </main>

    <footer class="footer">TI3041 Programacion Back End - INACAP 2026</footer>
    <script src="/static/js/ui-text.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const labels = window.uiText || {};
        document.querySelectorAll('[data-ui-text]').forEach(function (element) {
          const key = element.getAttribute('data-ui-text');
          if (labels[key]) {
            element.textContent = labels[key];
          }
        });
      });
    </script>
  </body>
</html>
